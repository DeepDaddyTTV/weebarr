# Weebarr Default Configuration
# Runtime configuration is currently environment-driven. This file is provided
# as a public example for compose stacks and future settings UI support.

version: 1

weebarr:
  host: "0.0.0.0"
  port: 8888
  anilist_cache_ttl_seconds: 21600
  seerr_cache_ttl_seconds: 900
  ui:
    theme: "deep-zone"

seerr:
  base_url: "http://seerr:5055"
  api_key: "change-me"
  request_seasons: "all"
  sonarr_server_id: null
  profile_id: null
  root_folder: null
  language_profile_id: null
  request_user_id: null
  tags: []

log_level: "INFO"
