name: Native Installer Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-native:
    name: Build Native Installers (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            platform: windows
            runner: windows-latest
          - label: macOS
            platform: macos
            runner: macos-13
          - label: Linux
            platform: linux
            runner: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system packaging tools (Windows)
        if: matrix.platform == 'windows'
        run: choco install innosetup --no-progress -y

      - name: Install system packaging tools (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm ruby-full build-essential
          sudo gem install --no-document fpm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .[desktop]

      - name: Build native artifacts
        run: python scripts/build_desktop_release.py --platform ${{ matrix.platform }}

      - name: Upload native artifacts
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.platform }}
          path: dist-native/*

  attach-release:
    name: Attach Native Installers To Release
    runs-on: ubuntu-latest
    needs: build-native
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download native artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: release-assets/*
