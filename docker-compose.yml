services:
  weebarr:
    image: ghcr.io/deepdaddyttv/weebarr:latest
    container_name: weebarr
    environment:
      TZ: UTC
      # Required when Weebarr is exposed through a reverse proxy, tunnel, HTTPS,
      # or when Plex sign-in is enabled.
      WEEBARR_PUBLIC_URL: ${WEEBARR_PUBLIC_URL:-http://localhost:18080}
      # Optional one-time bootstrap secret for intentionally claiming a brand-new
      # public instance. Leave blank for local-only first-run setup.
      WEEBARR_BOOTSTRAP_TOKEN: ${WEEBARR_BOOTSTRAP_TOKEN:-}
      SEERR_BASE_URL: ${SEERR_BASE_URL:-http://seerr:5055}
      SEERR_API_KEY: ${SEERR_API_KEY:-change-me}
      SEERR_REQUEST_SEASONS: ${SEERR_REQUEST_SEASONS:-all}
      ANILIST_CACHE_TTL_SECONDS: ${ANILIST_CACHE_TTL_SECONDS:-21600}
      SEERR_CACHE_TTL_SECONDS: ${SEERR_CACHE_TTL_SECONDS:-900}
      AUDIO_LOOKUP_ENABLED: ${AUDIO_LOOKUP_ENABLED:-true}
      AUDIO_CACHE_TTL_SECONDS: ${AUDIO_CACHE_TTL_SECONDS:-86400}
      AUDIO_LOOKUP_TIMEOUT_SECONDS: ${AUDIO_LOOKUP_TIMEOUT_SECONDS:-6}
    ports:
      - "18080:8888"
    volumes:
      - ./config:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
