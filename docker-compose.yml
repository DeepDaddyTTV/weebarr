services:
  weebarr:
    image: ghcr.io/deepdaddyttv/weebarr:latest
    container_name: weebarr
    environment:
      TZ: America/New_York
      SEERR_BASE_URL: ${SEERR_BASE_URL:-http://seerr:5055}
      SEERR_API_KEY: ${SEERR_API_KEY:-change-me}
      SEERR_REQUEST_SEASONS: ${SEERR_REQUEST_SEASONS:-all}
      ANILIST_CACHE_TTL_SECONDS: ${ANILIST_CACHE_TTL_SECONDS:-21600}
      SEERR_CACHE_TTL_SECONDS: ${SEERR_CACHE_TTL_SECONDS:-900}
    ports:
      - "8898:8888"
    volumes:
      - ./config:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
